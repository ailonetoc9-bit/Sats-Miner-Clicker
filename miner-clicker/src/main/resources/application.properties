spring.application.name=miner-clicker
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:./data/minerdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.telegram.dev-mode=${TELEGRAM_DEV_MODE:false}
app.monetag.zone-id=${MONETAG_ZONE_ID:}
app.monetag.sdk-url=${MONETAG_SDK_URL:}
app.monetag.postback-secret=${MONETAG_POSTBACK_SECRET:}
